# The /ideas command is the documented, intended entry point — so it needs a test that it
# actually invokes the pipeline, not just that the file exists.
#
# WHY THIS EXISTS. Two slash forms reach this plugin and they are NOT equivalent. A real
# commands/*.md file expands and invokes the skill. The skill auto-exposed by Claude Code as
# `/creative-problem-solving:creative-problem-solving` did NOT invoke it in harness testing —
# 794 words, zero tools, skillActivity 0 — while `:ideas` did. That asymmetry is invisible from
# the source tree and was found only by running both, so it gets a regression test here.
#
# LIMIT, read before trusting a green. This asserts the command ROUTES. It says nothing about
# whether the pipeline then produced good options — that is an ../../evals/ question, judged.
name: ideas-command
session: ../sessions/default.yaml
baseline: desktop-1.40609.0
fidelity: container
# The command tells the model not to ask, but mode choice can still legitimately raise one gate;
# `first` buys re-record robustness at the price of a nonDeterministic flag, as in the pipeline-* pair.
on_unanswered: first
# A full run is tens of minutes across roughly eighteen dispatches — far longer than the other
# scenarios here, which is why this one sets its own budget.
# WIDENED BACK, after the second observation arrived and refuted the first bound.
#
# Set at 46 min / $40 from ONE run (1634.4 s, $23.8071 — a burn of $0.0146/s), described at the
# time as 1.5x headroom. Then `deliverable-composition`, the same pipeline behind a different
# prompt, took **2736.7 s / $32.8139** — 45.6 minutes, leaving that bound **23 seconds** of margin.
# A gate with 23 seconds of headroom is a coin toss that reds a $30 run and looks like a skill
# defect, which is the failure this file's own note warned about while setting the number anyway.
#
# n=3, and the same rule applied to it. Observed on THIS scenario: 1634.4 s and 3688.3 s — a 2.3x
# spread between two runs of the same prompt. `deliverable-composition`, the same pipeline behind a
# different prompt, sat between them at 2736.7 s. The rule stated when this was last set is "2x the
# worst observed"; the worst observed is now 3688 s, so the bound moves with it rather than staying
# where an older maximum put it. 90 minutes would have left 1.46x on the longest run seen, which is
# thinner than the variance already measured.
#
# Cost and duration are NOT one bound expressed twice — that was wrong when written here. The burn
# rates differ 2x between those runs ($0.0146/s and $0.0071/s), so the longest run was the cheaper
# one. They are two independent bounds and $60 still covers a doubling of the worst cost seen.
timeout_ms: 7200000

# Leading slash is load-bearing: mid-sentence slashes are not expanded by the agent binary.
prompt: "/creative-problem-solving:ideas Our four independent bookshops are losing footfall, we cannot match online on price, and author events and a loyalty card are already spent. What else could we be?"

assert:
  - result: success
  # NOT SET, deliberately: `allow_undelivered_deliverables`. The harness warns when the run leaves
  # a file outside every user-visible root, and that warning is the ONLY thing that can see where
  # `slots.json` lands — `user_visible_artifact` and `file_exists` take literal paths with no glob
  # support (measured: even `outputs/*/report.md` fails against a run whose report.md is present),
  # and the run directory is a timestamp, so no assertion here can name the path. Suppressing the
  # warn would blind the one detector there is. It is warn-only, so read it.
  #
  # Post-hoc, not a cap: it cannot stop spend, only report that spend changed shape.
  # On a cassette lane this goes vacuous — the schema says it asserts "the frozen recording's cost,
  # not fresh spend", so under replay it compares a constant to a constant and cannot fail. If
  # cassettes are ever adopted, this assertion has to move to the live lane or go.
  - max_cost_usd: 60
  # THE REPLY MUST CARRY THE REPORT, NOT A SUMMARY OF IT.
  # `pipeline-report.md` step 10: "The file is the answer, and the reply is the file… Do not compose a
  # second, shorter version." Nothing enforced it. On 2026-08-28 the run shipped a 2,155-character
  # summary while `--check-reply` passed — because one Bash call did `cp report.md reply.md` and
  # checked the copy, which that same page predicts satisfies the gate by construction.
  #
  # This is the only assertion that reads the surface the defect lives on: `transcript_contains`
  # sees top-level assistant text, i.e. what the reader was actually sent. The marker is a band
  # heading `build_report.py` emits and a summary drops.
  #
  # Negative control, run on the kept 2026-08-28 run dir before this was added: the marker is in
  # `report.md` and NOT in that run's sent message, so this assertion reds it. Note what was
  # rejected — "Assumption I ran with" appears in BOTH, so the obvious marker passes vacuously.
  - transcript_contains: "## The rest, in rank order"
  # A SECOND marker, chosen for what a SUMMARY would not contain rather than for position.
  # "## Top 3" was the first candidate and is a bad one: a summary of a hundred families would
  # very plausibly write that heading, so the assertion would pass on exactly the output it
  # exists to catch -- the same vacuity that ruled out "Assumption I ran with", which appears in
  # both a full reply and a summary. This caveat sentence is the opposite: it introduces the
  # unverified band, it is meaningless in a document that does not carry that band, and a
  # summariser has no reason to reproduce it.
  #
  # Deliberately NOT asserting family headings or the closing read: headings are model-authored
  # per run and the closing line is a filled slot, so neither is a literal this file can name.
  # SUBSTRING OF BOTH BRANCHES. build_report.py:339-352 renders "*Mostly not checked by search…"
  # when any below-rank-13 lead carries a verdict, and "*Not checked by search…" otherwise — one
  # of three preserved runs takes the Mostly branch, so pinning "*Not" reds a correct run about a
  # third of the time. The shared tail keeps the summary-vacuity property that made this the right
  # marker in the first place.
  - transcript_contains: "checked by search. Verification covers"
  # The command routed INTO the skill. This is the whole point of the scenario: a run where the
  # command expands to prose the model then answers directly would still be `success`, and this
  # is the only assertion that separates those two outcomes.
  - skill_triggered: creative-problem-solving
  # The command carries no stages; they live in references/pipeline.md and are reached only
  # through the skill. Every script invocation is in that reference and nowhere else, so a bash
  # call cannot happen unless it was read — which makes this the check that the routing chain
  # holds end to end, not just that the skill fired.
  #
  # `Bash`, not `mcp__workspace__bash`: this scenario pins `fidelity: container`, where Bash is
  # native. The workspace alias belongs to the hostloop tier, and asserting it here names a tool
  # this lane never calls — a claim that cannot pass however well the skill behaves.
  - tool_called: "Bash"
  # The pipeline writes only under outputs/ and deletes nothing there. A run that improvises
  # scratch files and tidies them away is one `rm` away from removing a pool file, and a deleted
  # stage is exactly what the integrity check cannot see.
  - no_delete_in_outputs: true
  # Dispatch happened rather than being described. A run that narrates the fan-out reads the
  # same as one that performed it, and only the tool stream separates them.
  - subagent_dispatched: "creative-problem-solving:generator"
  # SKILL.md's "One question, and only about meaning" ceiling, as in both pipeline-* scenarios.
  # Counts sub-questions, not gates, and is satisfied by zero.
  - questions_count_max: 1
  # The report has to be REACHABLE, not merely written. Where a cwd-relative `outputs/<ts>/` lands
  # differs by lane: at host-loop the agent's cwd already IS the visible outputs dir, at container
  # it is a scratchpad sibling of mnt/, and on remote Cowork `outputs/` need not exist at all — so
  # a path check would assert a different thing on each. This asserts the property the reader
  # actually cares about, that the link they are handed resolves to a file, and it is
  # filename-agnostic: `user_visible_artifact` would need the exact name the model invents.
  - computer_links_resolve: true
