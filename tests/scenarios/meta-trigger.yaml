# Does the skill fire when someone asks how to improve a tool they maintain?
#
# WHY THIS EXISTS. A maintainer described their own tooling, listed three unsolved problems,
# and ended "I'm out of ideas that aren't just more rules in the file." The skill did NOT
# trigger — the model read the available source and answered directly instead.
#
# That prompt is the description's declared home turf almost verbatim (open-ended, no
# known-good answer, explicitly stuck, a rethink requested), and Phase 0 step 3b exists
# precisely for it: "I'm out of ideas that aren't just more rules" is a ruled-out constraint
# stated as a conclusion, and it happens to be false — so the best answer refuses the premise,
# which is the skill's best-measured move (5/5 vs 4/5 for a plain prompt).
#
# THE PROMPT DELIBERATELY DESCRIBES A HYPOTHETICAL TOOL, not this skill — because the class is
# what the description change targets, and a maintainer asking about their own repo is one
# instance of it.
#
# Note on the self-referential case, corrected: when the skill's own source is readable,
# reading it competes with invoking it — and that is NOT a harness artifact. Production mounts
# the skill source at the same path and it is equally readable there. So a maintainer asking
# about THIS skill, in this repo, is a genuine unfixed case rather than a testing artifact, and
# no scenario covers it. Testing it would need a repo checkout in the workspace.
#
# Do NOT assert a mode. Fast vs deep is legitimately arguable on this prompt and pinning it
# would buy a flake, not a guarantee.

name: meta-trigger
session: ../sessions/default.yaml
baseline: latest
fidelity: container
on_unanswered: first

prompt: |
  I maintain an internal CLI that our team uses to spin up test environments. Three things
  I can't fix by writing more documentation: people skip the setup step and then file bugs
  about it, the config file has grown to the point where nobody reads it before editing,
  and every time I add a validation check somebody works around it rather than fixing their
  config. I've rewritten the docs three times and added warnings everywhere.

  How could this be significantly better? I'm out of ideas that aren't just more rules in
  the file.

assert:
  - result: success
  - skill_available: creative-problem-solving
  # The whole point of this scenario.
  - skill_triggered: creative-problem-solving
  - dispatch_count_max: 0
