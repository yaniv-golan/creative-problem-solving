# The composition boundary: what happens when the answer becomes a FILE.
#
# WHY THIS EXISTS. Phases 0-3 constrain generation; composition — the memo, brief or deck the user
# asks for once the options exist — is a fresh generation pass with none of those constraints
# attached. That is where a pruned pipeline grows back: hedged options harden into committed
# policy, the load-bearing assumption and the who-runs-it line drop out, and specificity the
# pipeline never produced gets invented to fill a section. Phase 3's critique cannot reach any of
# it, because at Phase 3 those sentences do not exist yet. SKILL.md's "When the answer becomes a
# document" block is the rule this scenario guards.
#
# READ THIS BEFORE TRUSTING A GREEN RUN — two limits, both real.
#
# 1. It cannot see the defect it was written for. "Every number traces to pipeline output or user
#    data" is not a tool-stream fact; no assertion distinguishes an invented threshold from a
#    derived one. What IS checkable is the discipline that goes first when composition runs
#    unconstrained: the load-bearing assumption. A delivered document carrying no assumption
#    language anywhere has dropped Phase 3's annotations on the floor. Whether a surviving number
#    is real stays an ../../evals/ question, judged.
# 2. It compresses two turns into one. In practice the deliverable is requested AFTER the report,
#    on a later turn, with the pipeline's constraints already out of working attention — and an
#    asserted `run` is single-turn. One prompt asking for both is the weaker reproduction, and a
#    green here does not clear the later-turn case.
name: deliverable-composition
session: ../sessions/default.yaml
baseline: desktop-1.44121.1
fidelity: container
# Same trade the pipeline-* pair documents: no gate here is load-bearing for what is asserted
# (this prompt tells the model not to ask), so `first` buys re-record robustness at the price of
# a nonDeterministic flag, rather than an exact-label anchor that drifts. Since the brief gate at
# references/pipeline.md step 0d, that clause also takes the gate's skip path — the reading is
# said and the run does not stop — which is what keeps this scenario unattended.
on_unanswered: first

# Deliberately a strategic problem — the tier whose answers are long enough that composition has
# something to harden, and the tier where a document actually gets asked for. The named output
# path is what makes `user_visible_artifact` deterministic; the "don't ask me" clause is load-bearing, since a
# run that ends at a clarifying gate measures nothing.
# THE COMMAND PREFIX IS LOAD-BEARING — do not "tidy" it away.
# The description is explicit-only: it selects the skill on `/ideas`, on being named, or on "use
# creative problem solving on this" — and NOT merely because a prompt wants ideas or says the
# obvious answers are spent. This prompt used to do only the latter, so `skill_triggered` asserted
# the exact behaviour the description forbids: the model was RIGHT to answer directly and the
# scenario called that a failure (measured 2026-08-28, skill=offered,NOT-invoked, $1.13).
#
# Why the COMMAND rather than the phrase, given both are explicit. What this scenario tests happens
# AFTER invocation, so it must not be gated on a trigger decision it is not about — a phrase that
# fails to trigger reds this run with something indistinguishable from a pipeline regression, at
# full price. The command is the most reliable ask available (it is still prose instructing
# invocation, not a mechanical dispatch — which is what ../scenarios/ideas-command.yaml asserts).
# The phrase path is covered by `pipeline-bounded.yaml`, which is the only scenario that uses it.
# A separate trigger-only scenario was tried and withdrawn: the harness reds an errored run at the
# run level regardless of assertions, so a short `timeout_ms` could not make it cheap.
# check-repo.py gates the assertion/prompt pairing statically, token-free.
prompt: |
  /creative-problem-solving:ideas We run four independent bookshops, 30 staff, one city.
  Footfall is falling, we cannot match online on price, and we have already tried author events
  and a loyalty card. I don't think this model survives four more years — work out what else we
  could be, then write the result up as a strategy document at outputs/strategy.md. This is all
  the information available, so don't ask me any questions; where something is missing, make a
  reasonable assumption and state it.

assert:
  - result: success
  - skill_triggered: creative-problem-solving
  # ONE GATE, up to four things asked in it. The key counts SUB-QUESTIONS, not gates — which was
  # the modelling error behind the old ceiling of 1: it forced every ask into a single prose
  # sentence, and a live Cowork run showed the consequence, a 200-word block whose two actual
  # questions were its last twenty words. Two sub-questions in one gate is still one interruption,
  # which is what the promise to the reader was ever about. Four leaves room for the reading plus
  # the three things only the user can supply; a SECOND gate would still red this.
  - questions_count_max: 4
  # --- delivered-file class: manifest-backed, so live and (with a recorded manifest) replay ---
  # The deliverable reached a user-visible root. Catches the run that answers in chat and never
  # writes the file, which would make the assertion below pass vacuously on an absent artifact.
  - user_visible_artifact: outputs/strategy.md
  # The assumption discipline survived the boundary. A deliberately WIDE alternation: the exact
  # wording is the model's, and pinning "What has to be true" verbatim would assert SKILL.md's
  # template phrasing rather than the property. It fails on the document that carries no
  # assumption language anywhere — which is the composition pass having run unconstrained.
  - artifact_text:
      artifact: outputs/strategy.md
      matches: '(has to be true|have to be true|assumption|assumes|only if|depends on|would need to be)'
