# WHAT THIS COVERS, and what it deliberately does not.
#
# This file was `mode-gate-fast.yaml` and asserted mode selection. There are no modes: every run
# is grounded — Phase 0 retrieves what already exists as a difference constraint, Phase 3
# verifies the prominently-presented options by search. So the fast/deep pair had nothing left
# to distinguish and has been repurposed to assert the pipeline's shape on a bounded question.
#
# IT DOES NOT ASSERT SUB-AGENT DISPATCH, on purpose. SKILL.md requires it, but a body-level
# instruction to hand generation away was MEASURED at 1/6 compliance; the identical requirement
# in the command file got 6/6. Asserting dispatch here would buy a flake, not a guarantee.
# `ideas-command.yaml` covers the path where dispatch is reliable.
#
# HISTORY WORTH KEEPING. As the mode gate's negative half, this prompt's job was that a BOUNDED
# problem must NOT trigger deep mode — the direction that had actually failed: deep mode fired on
# this exact prompt in iteration 1 and cost 6.7x the wall-clock for a worse answer than a plain
# response. DESIGN-NOTES called that gate the most important thing in the skill. It no longer
# exists, and nothing replaced it, so this scenario can no longer assert proportionality at all —
# it asserts grounding. The unprotected case is recorded in DESIGN-NOTES ("The rebuild") rather
# than pretended away here.
#
# "Did it ground by search" is a fact about the tool stream, so it needs no grader — unlike
# eval 2, which tested the same property through an LLM-graded MODE CHECK assertion.

name: pipeline-bounded
session: ../sessions/default.yaml
baseline: desktop-1.44121.1
fidelity: container

# THE MEANING GATE THIS FILE USED TO DOCUMENT NO LONGER FIRES, and the prompt now says so.
# "Account-verification" is still ambiguous by design — that is why this prompt was chosen — but
# since references/pipeline.md step 0d the skill no longer raises meaning as a separate question:
# it picks the likeliest reading, states it in the reading line of the brief gate, and lets the
# user correct it there. The measured record of the old behaviour is kept because it is what the
# change replaced: the released-tree run (skillHash 6d73ce525e) raised exactly one gate — "What
# actually happens at the account-verification step?" — answered by `first` and flagged
# non-deterministic.
#
# So the prompt carries the don't-ask clause, which takes the gate's skip path, and the run stays
# unattended. The reading is still SAID on that path, which is what the new
# `transcript_contains: "Reading this as"` assertion below checks — the disclosure survived the
# change even though the question did not. `brief-gate.yaml` measures the asking path.
#
# `first` stays as a backstop for any gate raised anyway: the answer is immaterial to what this
# scenario asserts (whichever reading it takes, a bounded product question must not fan out), and
# the harness's guidance is to label-anchor only the gates whose choice drives an assertion.
on_unanswered: first

# THE COMMAND PREFIX IS LOAD-BEARING — do not "tidy" it away.
# The description is explicit-only: it selects the skill on `/ideas`, on being named, or on "use
# creative problem solving on this" — and NOT merely because a prompt wants ideas or says the
# obvious answers are spent. This prompt used to do only the latter, so `skill_triggered` asserted
# the exact behaviour the description forbids: the model was RIGHT to answer directly and the
# scenario called that a failure (measured 2026-08-28, skill=offered,NOT-invoked, $1.13).
#
# THIS SCENARIO CARRIES THE PHRASE PATH, AND IT IS THE ONLY ONE THAT DOES.
# The description names three ways to ask: `/ideas`, naming the skill, and this phrasing.
# `ideas-command.yaml` covers the command; `pipeline-strategic` and `deliverable-composition` open
# with the command too, because a trigger flake there wastes a full pipeline run. If this one also
# used the command, NOTHING would exercise the phrase — and the phrase is the fragile path, since
# it resolves by description matching and the description is what gets edited. A narrowing edit
# could break it while the whole suite stayed green, because a command bypasses the matching that
# broke. commands/ideas.md also claims "a run reached by asking for the skill by name and a run
# reached by typing /ideas are the same run"; this is what checks it.
#
# A separate cheap trigger-only scenario was tried and withdrawn (2026-08-28). It relied on a short
# `timeout_ms` to kill the run just after invocation — but the harness reds an errored run at the
# RUN level regardless of assertions: `result: error` recorded pass:true and the scenario still
# exited 1. There is no clean early stop (`max_turns` and `max_cost_usd` are post-hoc assertions,
# not caps), so isolated phrase coverage costs a whole extra pipeline run. Attaching it here costs
# nothing extra. Measured twice live: the phrase triggers (skill=offered,invoked, 2 of 2).
#
# What that trade gives up, stated: a phrase-trigger failure lands on THIS scenario and takes its
# grounding assertions with it. That is survivable because the harness names the cause —
# `skill=offered,NOT-invoked` with the failing assertion — so the diagnosis is not ambiguous, only
# the run is wasted. check-repo.py gates the assertion/prompt pairing statically, token-free.
prompt: |
  Our onboarding flow has a 60% drop-off at the account-verification step. We've already
  tried shortening the form and adding a progress bar. I'm out of ideas — use creative
  problem solving on this. Don't ask me any questions — just run.

assert:
  - result: success
  - skill_triggered: creative-problem-solving
  # INVERTED from this file's mode-gate era, where it asserted tool_not_called: WebSearch
  # because absence of research was fast mode's whole signature. Grounding is unconditional
  # now, so the failure guarded here is a run that SKIPS it — which would put unchecked
  # borrowed mechanisms in front of a reader.
  - tool_called: WebSearch
  # SKILL.md: "One question, and only about meaning" — scope, emphasis, target segment,
  # detail level and output format all fail its bar. This counts SUB-questions, so a single
  # AskUserQuestion bundling three of them counts as 3, which is the violation itself rather
  # than a technicality. An EARLIER generation (skillHash f8566139f7) bundled 4 and 3
  # sub-questions on the deep scenario, including "What should the deliverable look like?" —
  # an output-format question the rule excludes by name. This is the assertion that catches
  # that class coming back.
  #
  # CEILING, stated so a green is not over-read: this sees `AskUserQuestion` gates only. The
  # skill mandates no gate tool — step 0d says "ask the user" and names no mechanism — so a run
  # that asks three questions in plain chat records zero gates and passes. It is a partial guard
  # on the rule, not coverage of it. A maximum is also satisfied by zero, so it never requires a
  # gate to fire — which is the expected shape here, since the prompt takes the skip path.
  - questions_count_max: 4
  # THE READING IS SAID EVEN WHEN NOTHING IS ASKED. The skip path prints the same reading line the
  # asking path does; a run that skipped the gate ENTIRELY, rather than skipping the question,
  # would drop it. That is the failure this catches, and it is the one the whole gate exists to
  # prevent: forty minutes spent on a reading the reader never saw.
  - transcript_contains: "Reading this as"

