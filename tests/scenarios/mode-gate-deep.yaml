# The mode gate, positive half: an open STRATEGIC problem must actually do the research.
#
# READ THIS BEFORE TRUSTING A GREEN RUN. Deep mode's tool-stream signature is a SINGLE BOOLEAN
# — did WebSearch fire. So this scenario proves "deep mode did the thing that distinguishes it
# from fast mode". It does NOT prove the pipeline ran: a deep-mode announcement that searched
# twice and narrated everything else would pass. Nothing in the tool stream can prove more,
# now that generation is in-context by design. Answer quality lives in ../../evals/, judged.
#
#
# The prompt is phrased as a situation with a stated constraint, and tells the agent not to ask
# questions. Both are load-bearing: a prompt that draws a clarifying gate ends the run at the
# gate and measures nothing. ../../evals/README.md has the worked case.
name: mode-gate-deep
session: ../sessions/default.yaml
baseline: latest
fidelity: container
on_unanswered: first

prompt: |
  Our architecture practice is 60 people doing mixed commercial and institutional work. Fees
  are compressing, clients now expect AI-assisted delivery speed, and we've already tried
  raising utilisation and hiring cheaper juniors. I don't think our current model survives
  four more years — what else could we be? This is all the information available, so don't ask
  me any questions; where something is missing, make a reasonable assumption and state it in
  your response.

assert:
  - result: success
  - skill_triggered: creative-problem-solving
  # The one thing deep mode is now FOR.
  - tool_called: WebSearch
  # No fan-out in either mode as of 0.1.0.
  - dispatch_count_max: 0
