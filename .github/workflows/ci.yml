name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so release.yml can depend on THIS suite rather than a copy of it. A duplicated
  # step list is a gate that drifts: the copy stays green while the original gains a check.
  workflow_call:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a moving tag. SECURITY.md scopes
# "workflows that would cause an installer to fetch code from somewhere other than this
# repository" as in-scope, and a mutable tag is exactly that hole. Dependabot understands
# the `@<sha> # <tag>` form and keeps both halves current.
jobs:
  test:
    name: diversity.py tests (repo tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      # diversity.py is retired from the skill and no longer installs on user
      # machines, so the 3.8-floor matrix is gone with it. The no-numpy path is
      # still exercised: numpy remains an optional accelerator for maintainers.
      - name: Run tests without numpy
        working-directory: tools
        run: python3 test_diversity.py

      - name: Run tests with numpy
        working-directory: tools
        run: |
          python3 -m pip install --quiet numpy
          python3 test_diversity.py

      # The scripts the /ideas pipeline shells out to. They hold the invariants a run cannot
      # recover from — a lost option, a pair judged twice with different verdicts, a heartbeat that
      # never fires — and unlike tests/scenarios/ they need no Docker, no token and no model, so
      # they belong on the PR gate where a forked PR can pass them.
      # Pinned exactly, for the reason the harness pin is exact: a floating linter changes what
      # CI asserts without anyone editing the repo, and a NEW rule appearing in a patch release
      # reds a build for a change nobody made. Upgrading is a deliberate edit.
      #
      # Scope is everything not excluded in pyproject.toml, which deliberately includes
      # evals/instruments/ — those are frozen-by-hash and never execute in CI, and a file nothing
      # runs is exactly where an unused name or a bare except sits undisturbed.
      - name: Lint
        run: |
          python3 -m pip install --quiet ruff==0.15.0
          python3 -m ruff check .

      - name: Pipeline script tests
        run: python3 tools/test_pipeline_scripts.py

      # Drives a real `git commit` in a throwaway repo. A hook that is correct and not installed
      # renders exactly like one that ran, so this asserts the hook is reached, not only that its
      # stripping is right — and carries a negative control that fails if the hook is absent.
      - name: Git hook tests
        run: python3 tools/test_hooks.py

  integrity:
    name: Repo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      # Versions agree everywhere, the .agents/ mirror has not drifted,
      # SKILL.md is under the platform line limit, referenced files exist.
      - name: Check repo integrity
        run: python3 tools/check-repo.py

      # evals/scenarios/*.yaml are generated from evals/evals.json. The JSON is the record — the
      # assertions, versioned, with the reasoning for every change. This fails if someone
      # hand-edited a scenario, which would leave the rubric grading something nobody wrote down.
      # The generated Pages homepage linked README#installation and README#evals for months.
      # Neither heading has ever existed, and a dead in-page anchor does not 404 -- the browser
      # lands at the top of the page and looks fine, which is why nobody noticed.
      - name: Generated Pages links resolve
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          wf = pathlib.Path(".github/workflows/deploy-pages.yml").read_text()
          readme = pathlib.Path("README.md").read_text()
          slugs = {re.sub(r"[^a-z0-9 -]", "", h.lower()).strip().replace(" ", "-")
                   for h in re.findall(r"^#+ (.+)$", readme, re.M)}
          bad = [a for a in re.findall(r"creative-problem-solving#([A-Za-z0-9_-]+)", wf)
                 if a not in slugs]
          if bad:
              print("::error::deploy-pages.yml links README anchors that do not exist: %s" % bad)
              print("   README headings resolve to: %s" % sorted(slugs))
              sys.exit(1)
          print("all README anchors referenced by deploy-pages.yml resolve")
          PY

      - name: Eval scenarios match evals.json
        run: python3 tools/build-eval-scenarios.py --check

      - name: Build the distributable zip
        run: python3 tools/build-zip.py

      - name: Upload zip artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: creative-problem-solving-zip
          path: dist/creative-problem-solving.zip
          if-no-files-found: error

  scenario-lint:
    name: Behavioural scenario lint
    runs-on: ubuntu-latest
    # The token-free half of tests/. None of these three commands needs Docker or a Claude
    # token, so unlike the live `run` lane they are safe on the PR gate — a forked PR can
    # pass them. `lint` catches an assertion placed on a lane where it would silently
    # evaluate to nothing, which is the failure mode that makes a scenario look green while
    # asserting nothing at all; `lint-skill` and `analyze-skill` scan the skill body itself.
    #
    # The job id and display name are deliberately unchanged now that it does more than
    # scenario linting — renaming a check that branch protection may require would make the
    # required check read as missing. Rename both together, if ever.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # An EXACT pin, changed from `^1.24.0` on 2026-08-24. The caret was doing what it was
      # written to do — holding major 1 so a 2.x could not break this gate — and the cost was
      # that CI and every developer here stopped testing the same tool. Local resolved 2.1.0
      # while CI resolved inside 1.x, and three of the nine issues this repo was preparing to
      # file upstream turned out to be already fixed in the version CI was not running. A
      # floating range hides that; an exact pin turns it into a visible bump.
      #
      # Upgrading is now a deliberate edit: run the four checks below locally against the new
      # version first, then change this line. Bumped 2.5.0 -> 3.2.0 on 2026-09-01 that way; all four
      # were rc=0 beforehand, and `lint --output-format json` returned the SAME 8 findings under both
      # versions (identical rule/severity/file triples), so no check silently changed meaning.
      #
      # PIN AN EXACT VERSION, NOT A CARET. The bundled cowork-harness skill says "Pin @^3.2.0, never
      # @latest" -- that guidance is for ad-hoc CLI installs. Upstream's own docs/ci.md calls an exact
      # ref "the maximally reproducible choice" for this input, and the block above records why this
      # repo cares: a 1.24.0 bump once moved the tests to a different baseline silently.
      #
      # Scenarios pin an exact `baseline:` too, so a harness bump does NOT silently move which
      # platform baseline they resolve against — that failure mode is closed. It was real: a
      # 1.24.0 bump moved the tests to `desktop-1.32352.0` and left the reliability table
      # describing a platform they no longer ran on (see CHANGELOG 0.2.0). Moving the baseline
      # is now its own edit across the twelve scenarios and tools/build-eval-scenarios.py.
      #
      # Moved 2026-09-01: all twelve now pin `desktop-1.40609.0`, because `desktop-1.37937.1`'s agent
      # binary (2.1.246) was pruned by a Desktop update and eleven scenarios could not run at all.
      # This hop does NOT invalidate the measured figures: every runtime-consumed baseline field
      # (spawn, mountLayout, guest, network, settings, bgEnvStrip, requireFullVmSandbox, platform) is
      # byte-identical between the two, the only runtime delta is the agent ELF 2.1.246 -> 2.1.247,
      # and the recorded runs already used 2.1.247 as a fallback. The gate that differs
      # (subagentPromptServerOverride:124685897) is read only by `sync`, never by the runtime loop.
      - name: Install cowork-harness
        run: npm install --global cowork-harness@3.2.0

      # --strict makes the WARN class gate, which a bare lint would only print. --min-severity
      # WARN is the other half and it is load-bearing, not decoration: `gate-needs-controlout`
      # is an unconditional INFO advisory that fires on the mere PRESENCE of a gate assertion
      # (both pipeline-* scenarios now carry `questions_count_max`), and the linter is static —
      # it never reads a cassette, so it cannot know the advice does not apply. Without the
      # floor, --strict reds this gate on an advisory about a cassette this repo does not have.
      - name: Lint scenarios
        run: cowork-harness lint --strict --min-severity WARN tests/scenarios/*.yaml

      # The eval scenarios lint on the same gate. They are live-only (a `semantic_matches` judge
      # is a model call) so they never RUN here — but a malformed rubric or a misspelled assertion
      # key is exactly the kind of thing that would otherwise be found only by spending tokens.
      - name: Lint eval scenarios
        run: cowork-harness lint --strict --min-severity WARN evals/scenarios/*.yaml

      # Two static scans, both token-free and fork-safe. They were adopted as regression insurance
      # against footguns the skill had no way to commit; the 2026-08-23 rebuild gave it three of
      # the four — scripts invoked as `python3 "$CPS/scripts/<name>.py"`, a root the pipeline
      # resolves once at step 0 (the ${CLAUDE_PLUGIN_ROOT} form was measured reaching bash empty), and
      # six pinned subagent types (still no hooks.json).
      #
      # Their scopes differ and it matters. analyze-skill takes the PLUGIN root and scans all 14
      # files, commands/ideas.md and agents/*.md included — where those paths and type names
      # actually live. lint-skill takes the SKILL directory and reads SKILL.md alone; it errors
      # `no-skill` if pointed at the plugin root. So its footgun checks are aimed at a file that
      # contains neither, which tests/README.md records as a known gap rather than a green.
      #
      # analyze-skill reserves exit 3 for could-not-verify, independently of --strict: a red there
      # means the scan could not run, which is a different fact from a finding.
      - name: Lint skill body for Cowork host-loop footguns
        run: cowork-harness lint-skill --strict creative-problem-solving/skills/creative-problem-solving

      - name: Static path-fidelity and artifact scan
        run: cowork-harness analyze-skill creative-problem-solving --strict
