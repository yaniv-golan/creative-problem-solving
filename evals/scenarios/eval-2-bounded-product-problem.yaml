# GENERATED from ../evals.json (v8, eval 2) by tools/build-eval-scenarios.py.
# Edit the assertions THERE and regenerate — a hand-edit here fails CI's --check.
#
# Bounded problem. Measures diagnosis before prescription, and proportionality: the risk
# here is an oversized answer, not a thin one.
name: eval-2-bounded-product-problem
session: ../sessions/default.yaml
baseline: desktop-1.40609.0
fidelity: container
# The eval prompts are self-contained and several end by telling the model not to ask, so a gate
# here is a finding rather than something to script an answer for.
on_unanswered: first

prompt: |
  Our onboarding flow has a 60% drop-off at the account-verification step. We've already tried shortening the form and adding a progress bar. I'm out of ideas — what else could we do?

assert:
  - result: success
  # semantic_matches is LIVE-ONLY: the judge is a model call, so this cannot run on the
  # token-free replay lane, and `lint` says so. That warning is expected here, not a defect.
  #
  # semantic_matches is TOOL-USE BLIND. Its judged corpus is the final message, the transcript
  # and authored files — never a tool call (harness TOOL_USE_BLIND_KEYS). So a rubric claim about
  # what the model DID, as opposed to what it said or wrote, is only as good as the trace it left
  # in text or on disk. Keep the claims here about reader-visible output, and let the hard
  # assertions above carry anything that depends on a tool call.
  #
  # No min_pass. Recipe 5's point is that answers vary run to run, so the signal is each claim's
  # pass RATE across N>=3 reps, read from RunResult.assertions[].semanticClaims — not one green.
  # Set min_pass to the reliably-hit core once a baseline profile exists.
  - semantic_matches:
      rubric:
        - "Distinguishes between possible CAUSES of the drop-off before proposing fixes, rather than going straight to an idea list"
        - "Raises that the 60% may be composed of different populations, or may be partly a measurement or attribution artifact"
        - "Does not re-propose shortening the form or adding a progress bar"
        - "At least one option questions whether verification needs to happen at that point in the flow at all"
        - "Options differ in mechanism (channel, timing, who verifies, whether to verify) rather than in copy, layout, or visual design"
        - "Handles the ambiguity in 'account-verification' \u2014 either asks which kind, or states which reading it assumed and what would change under the others"
        - "Proportionate to a bounded product question: under roughly 1200 words, no ceremonial section headings with no content under them"
        - "Any borrowed mechanism or outside-world claim (how another company operates, what a field's practice is, a study, an organism) is either supported where it is stated or explicitly labelled unverified \u2014 not presented at the same confidence as the rest"
        - "The diagnosis block is a signpost rather than a section: roughly 3 lines or under ~120 words, not a third of the response"
        - "Does not quote an internal process metric or pipeline artifact to the reader \u2014 no scores, pass counts, lens names, family ids or cut lists"
